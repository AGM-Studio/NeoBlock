#file: noinspection UndefinedAction,UndefinedParamsPresent
name: Build and Release
on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git to use PAT
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew build --no-configuration-cache

      - name: Delete local tag if exists
        run: git tag -d experimental-build || true

      - name: Delete remote tag if exists
        run: git push origin :refs/tags/experimental-build || true

      - name: Create tag
        run: git tag experimental-build

      - name: Push tag
        run: git push origin experimental-build

      - name: Stage Release JARs
        run: |
          mkdir -p release_artifacts
          find build -type f -name "neoblock-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" \
            -exec cp -v {} release_artifacts/ \;

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental-build
          name: Experimental Build
          body_path: .github/experimental-build.md
          files: release_artifacts/*.jar
          prune_assets: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}